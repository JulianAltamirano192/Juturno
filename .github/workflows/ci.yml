name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Create btree_gist extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d saas_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/saas_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/saas_test
          REDIS_URL: redis://localhost:6379/0
          MP_SECRET_KEY: test-secret
          MP_ACCESS_TOKEN: TEST-fake
          META_VERIFY_TOKEN: test-verify
          META_APP_SECRET: test-app-secret
          WHATSAPP_TOKEN: test-token
          WHATSAPP_PHONE_NUMBER_ID: '123456789'
        run: |
          pytest -v
