<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>{% block title %}Juturno{% endblock %}</title>
<style>
  :root{
    --primary:#2563eb; --primary-dark:#1d4ed8;
    --bg:#f4f6fa; --card:#ffffff;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --danger-bg:#fef2f2; --danger:#b91c1c; --ok-bg:#f0fdf4; --ok:#16a34a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

  /* Auth pages layout */
  .auth-wrap{max-width:440px;margin:0 auto;padding:48px 16px 64px;min-height:100vh}
  .auth-header{text-align:center;margin-bottom:24px}
  .auth-header .logo{font-size:1.6rem;font-weight:900;color:var(--primary);letter-spacing:-0.5px}
  .auth-header h1{font-size:1.35rem;font-weight:800;margin-top:8px}
  .auth-header .sub{color:var(--muted);font-size:.92rem;margin-top:4px}

  /* Dashboard layout */
  .dash-header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:24px}
  .dash-header .logo{font-size:1.3rem;font-weight:900;color:var(--primary)}
  .dash-nav{display:flex;gap:4px;flex:1;justify-content:center}
  .dash-nav a{padding:8px 14px;border-radius:8px;font-size:.88rem;font-weight:600;color:var(--muted);text-decoration:none}
  .dash-nav a:hover{background:#f8fafc;color:var(--text)}
  .user-nav{display:flex;align-items:center;gap:16px}
  .tenant-name{font-weight:600;font-size:.95rem}
  .btn-logout{background:none;border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
  .btn-logout:hover{background:#f8fafc;color:var(--text)}
  .dash-content{max-width:800px;margin:32px auto;padding:0 16px}

  /* Shared components */
  .card{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 1px 3px rgba(15,23,42,.07)}
  .banner-danger{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:12px 14px;font-size:.9rem;line-height:1.4;margin-bottom:18px}
  .banner-ok{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:.9rem;line-height:1.4;margin-bottom:18px}
  .field{margin-bottom:16px}
  label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:6px}
  .field-desc{font-size:.78rem;color:var(--muted);margin-bottom:6px}
  input{width:100%;font-size:15px;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-family:inherit;color:inherit;background:#fff}
  input:focus{outline:none;border-color:var(--primary)}
  .btn-submit{display:block;width:100%;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:20px;font-family:inherit}
  .btn-submit:hover{background:var(--primary-dark)}
  .footer-links{text-align:center;margin-top:20px;font-size:.9rem;color:var(--muted)}
  .footer-links a{color:var(--primary);text-decoration:none;font-weight:600}
  .footer-links a:hover{text-decoration:underline}

  /* Typography basics for content */
  h1{font-size:1.4rem;font-weight:800}
  p{color:var(--muted);margin-top:8px;font-size:.95rem}
</style>
</head>
<body>

{% if tenant %}
<header class="dash-header">
  <div class="logo">Juturno</div>
  <nav class="dash-nav">
    <a href="/panel/agenda">Agenda</a>
    <a href="/panel/services">Servicios</a>
    <a href="/panel/staff">Personal</a>
    <a href="/panel/horarios">Horarios</a>
  </nav>
  <div class="user-nav">
    <span class="tenant-name">{{ tenant.name }}</span>
    <form method="POST" action="/logout" style="margin:0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="btn-logout">Cerrar sesión</button>
    </form>
  </div>
</header>
<main class="dash-content">
  {% block dash_content %}{% endblock %}
</main>
{% else %}
<div class="auth-wrap">
  <div class="auth-header">
    <div class="logo">Juturno</div>
    <h1>{% block auth_title %}{% endblock %}</h1>
    <p class="sub">{% block auth_sub %}{% endblock %}</p>
  </div>
  {% block auth_content %}{% endblock %}
</div>
{% endif %}

</body>
</html>
