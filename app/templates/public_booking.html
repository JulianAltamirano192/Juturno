<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08080b">
<title>Reservar turno en {{ tenant_name }}</title>
<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root{
    --bg:#08080b; --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.12);
    --text:#eef0f6; --muted:#a9aebb; --cyan:#22d3ee; --cyan-l:#67e8f9; --cyan-xl:#a5f3fc; --purple:#a855f7;
    --grad:linear-gradient(90deg,#d946ef 0%,#a855f7 50%,#6d6cf6 78%,#22d3ee 112%);
    --display:'Sora',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'DM Sans',system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse 90% 40% at 50% 0%,rgba(168,85,247,.18),rgba(8,8,11,0) 70%) fixed,var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 110px;min-height:100vh}
  header{padding:4px 0 6px}
  .head-row{display:flex;align-items:center;gap:12px;min-height:44px}
  .back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1.4rem;line-height:1;cursor:pointer}
  .back[hidden]{display:none}
  .biz-avatar{width:44px;height:44px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;color:#fff;background:linear-gradient(135deg,#a855f7,#22d3ee);box-shadow:0 0 16px rgba(168,85,247,.45)}
  .head-txt{min-width:0}
  h1{font-family:var(--display);font-size:1.15rem;font-weight:700;line-height:1.2;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.85rem;margin-top:2px}
  .progress{display:flex;gap:6px;margin-top:14px}
  .progress[hidden]{display:none}
  .progress span{flex-grow:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
  .progress span.on{background:linear-gradient(90deg,var(--purple),var(--cyan));box-shadow:0 0 8px rgba(34,211,238,.5)}
  .banner{margin:14px 0 0;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.45);color:#fecaca;border-radius:12px;padding:12px 14px;font-size:.92rem;line-height:1.4}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:14px}
  .step-title{font-family:var(--display);font-size:1.35rem;font-weight:700;letter-spacing:-.02em;margin-top:18px}
  .chip{display:inline-block;background:rgba(34,211,238,.1);border:1px solid rgba(103,232,249,.3);color:var(--cyan-xl);font-size:.82rem;font-weight:500;border-radius:999px;padding:6px 12px;margin:10px 0 0}
  .service-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:72px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-top:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .service-row:hover,.service-row:active{border-color:rgba(103,232,249,.6);background:rgba(34,211,238,.07)}
  .service-name{display:block;font-weight:600;font-size:1rem}
  .service-dep{display:inline-block;margin-top:6px;font-size:.75rem;font-weight:600;color:var(--cyan-xl);padding:4px 9px;border-radius:999px;background:rgba(34,211,238,.12)}
  .service-price{text-align:right;flex-shrink:0}
  .price{display:block;font-weight:700}
  .dur{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
  .days{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 64px;min-height:72px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 4px;cursor:pointer;text-align:center;font:inherit;color:inherit}
  .day .wd{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .day .dn{display:block;font-family:var(--display);font-size:1.25rem;font-weight:700;margin-top:2px}
  .day .mo{display:block;font-size:.72rem;color:var(--muted)}
  .day.sel{border-color:var(--cyan);background:rgba(34,211,238,.14);box-shadow:0 0 12px rgba(34,211,238,.35)}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 0 4px}
  .slot{min-height:48px;background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;font-weight:500;font-size:1rem;font-family:inherit;color:inherit}
  .slot:hover{border-color:var(--cyan)}
  .slot.sel{border-color:var(--cyan);background:linear-gradient(135deg,rgba(168,85,247,.35),rgba(34,211,238,.35))}
  .muted-box{color:var(--muted);text-align:center;padding:28px 16px;font-size:.95rem;line-height:1.5}
  .mini{display:block;margin:16px auto 0;min-height:44px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 20px;font-weight:600;color:var(--cyan-l);cursor:pointer;font-size:.95rem;font-family:inherit}
  label{display:block;font-size:.88rem;font-weight:600;color:#e3e5ec;margin:16px 0 8px}
  label:first-child{margin-top:0}
  input{width:100%;height:52px;font-size:16px;padding:0 14px;border:1px solid rgba(255,255,255,.16);border-radius:12px;font-family:inherit;color:var(--text);background:rgba(255,255,255,.04)}
  input::placeholder{color:#7f8494}
  input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
  .hint{color:var(--muted);font-size:.82rem;margin-top:14px;line-height:1.5}
  .summary .row{display:flex;justify-content:space-between;gap:12px;font-size:.95rem;padding:5px 0}
  .summary .row span:first-child{color:var(--muted)}
  .summary .row span:last-child{font-weight:600;text-align:right}
  .summary .row:last-child span:last-child{color:var(--cyan-l)}
  .cta-wrap{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,11,.9);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .cta-inner{max-width:448px;margin:0 auto}
  .cta{display:block;width:100%;min-height:54px;background:var(--grad);color:#fff;border:none;border-radius:999px;padding:0 16px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 0 16px rgba(217,70,239,.5)}
  .cta:disabled{opacity:.45;cursor:default;box-shadow:none}
  .result{text-align:center;padding:32px 20px}
  .icon{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .icon.ok{background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.6);box-shadow:0 0 30px rgba(34,211,238,.4)}
  .icon.bad{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.5);box-shadow:0 0 30px rgba(248,113,113,.3)}
  .icon.wait{background:rgba(168,85,247,.14);border:1px solid rgba(192,132,252,.6);box-shadow:0 0 30px rgba(168,85,247,.4)}
  .result h2{font-family:var(--display);font-size:1.4rem;margin-bottom:8px}
  .result p{color:var(--muted);font-size:.95rem;line-height:1.55}
  .result .cta{margin-top:20px}
  .pulse{color:var(--muted);text-align:center;padding:28px 16px;font-size:.95rem;animation:blink 1.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.45}}
  :focus-visible{outline:2px solid var(--cyan-l);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <button id="back-btn" class="back" type="button" aria-label="Volver" hidden>&#8249;</button>
      <span class="biz-avatar" aria-hidden="true">{{ tenant_name[:1]|upper }}</span>
      <div class="head-txt">
        <h1>{{ tenant_name }}</h1>
        <p class="sub" id="subtitle">Reservá tu turno online</p>
      </div>
    </div>
    <div class="progress" id="progress" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="app"></main>
  <div class="cta-wrap" id="cta-wrap" hidden>
    <div class="cta-inner">
      <button id="cta" class="cta" type="button" disabled>Reservar y pagar seña</button>
    </div>
  </div>
</div>
<noscript><p style="text-align:center;padding:24px">Para reservar necesitás tener JavaScript activado. Si no podés, contactate con el negocio por WhatsApp.</p></noscript>
<script>
const APP = {
  tenantId: {{ tenant_id }},
  tenantName: {{ tenant_name | tojson }},
  services: {{ services | tojson }},
};

const state = { step: "service", service: null, day: null, slot: null, slots: null };

const app = document.getElementById("app");
const backBtn = document.getElementById("back-btn");
const subtitle = document.getElementById("subtitle");
const banner = document.getElementById("banner");
const ctaWrap = document.getElementById("cta-wrap");
const cta = document.getElementById("cta");
const progress = document.getElementById("progress");
const STEPS = ["service", "day", "slot", "form"];

function setProgress(step) {
  const idx = STEPS.indexOf(step);
  progress.hidden = idx === -1;
  progress.querySelectorAll("span").forEach((seg, i) => seg.classList.toggle("on", i <= idx));
}

// ---------- helpers ----------
function esc(s) {
  const map = { "&": "amp", "<": "lt", ">": "gt", '"': "quot", "'": "apos" };
  return String(s).replace(/[&<>"']/g, (c) => "&" + map[c] + ";");
}
function fmtMoney(n) { return "$ " + Number(n).toLocaleString("es-AR", { maximumFractionDigits: 2 }); }
function localISO(d) {
  const p = (x) => String(x).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function fmtDateLong(iso) {
  const s = new Date(iso + "T12:00:00").toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function uuid() {
  return (crypto.randomUUID) ? crypto.randomUUID()
    : "bk-" + Date.now() + "-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}
function showBanner(msg) { banner.textContent = msg; banner.hidden = false; }
function hideBanner() { banner.hidden = true; }
function setBusy(on, label) {
  cta.disabled = on;
  cta.textContent = label || "Reservar y pagar seña";
}

// ---------- render ----------
function render() {
  hideBanner();
  if (state.step === "service") renderService();
  else if (state.step === "day") renderDay();
  else if (state.step === "slot") renderSlot();
  else if (state.step === "form") renderForm();
  backBtn.hidden = state.step === "service";
  ctaWrap.hidden = state.step !== "form";
  setProgress(state.step);
  window.scrollTo(0, 0);
}

function serviceChip() {
  return '<div class="chip">' + esc(state.service.name) + " · " + state.service.duration_minutes + " min</div>";
}

function renderService() {
  subtitle.textContent = "Reservá tu turno online";
  let html = '<p class="step-title">Elegí un servicio</p>';
  if (!APP.services.length) {
    html += '<div class="card muted-box">Este negocio todavía no publicó servicios disponibles.</div>';
    app.innerHTML = html;
    return;
  }
  APP.services.forEach((s, i) => {
    html += '<button type="button" class="service-row" onclick="selectService(' + i + ')">'
      + '<span><span class="service-name">' + esc(s.name) + '</span>'
      + '<span class="service-dep">Seña ' + fmtMoney(s.deposit_amount) + "</span></span>"
      + '<span class="service-price"><span class="price">' + fmtMoney(s.price) + "</span>"
      + '<span class="dur">' + s.duration_minutes + " min</span></span></button>";
  });
  app.innerHTML = html;
}

function renderDay() {
  subtitle.textContent = "Paso 2 de 4 · Elegí el día";
  const today = new Date();
  let html = '<p class="step-title">¿Qué día te queda mejor?</p>' + serviceChip() + '<div class="days">';
  for (let i = 0; i < 14; i++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    const wd = i === 0 ? "Hoy" : i === 1 ? "Mañ" : d.toLocaleDateString("es-AR", { weekday: "short" }).replace(".", "");
    html += '<button type="button" class="day' + (state.day === localISO(d) ? " sel" : "") + '" onclick="selectDay(\'' + localISO(d) + '\')">'
      + '<span class="wd">' + wd + '</span><span class="dn">' + d.getDate() + "</span>"
      + '<span class="mo">' + d.toLocaleDateString("es-AR", { month: "short" }).replace(".", "") + "</span></button>";
  }
  app.innerHTML = html + "</div>";
}

function renderSlot() {
  subtitle.textContent = "Paso 3 de 4 · Elegí el horario";
  let html = '<p class="step-title">' + fmtDateLong(state.day) + "</p>" + serviceChip();
  if (state.slots === null) {
    html += '<div class="pulse">Buscando horarios disponibles…</div>';
  } else if (state.slots === "error") {
    html += '<div class="muted-box">No pudimos cargar los horarios.<br>Revisá tu conexión.</div>'
      + '<button type="button" class="mini" onclick="loadSlots()">Reintentar</button>';
  } else if (!state.slots.length) {
    html += '<div class="muted-box">No quedan horarios libres este día.<br>Elegí otro día, por favor.</div>';
  } else {
    html += '<div class="slots">';
    state.slots.forEach((t) => {
      html += '<button type="button" class="slot' + (state.slot === t ? " sel" : "") + '" onclick="selectSlot(\'' + t + '\')">' + t + "</button>";
    });
    html += "</div>";
  }
  app.innerHTML = html;
}

function renderForm() {
  subtitle.textContent = "Paso 4 de 4 · Tus datos";
  app.innerHTML =
    '<div class="card summary">'
    + '<div class="row"><span>' + esc(state.service.name) + "</span><span>" + fmtMoney(state.service.price) + "</span></div>"
    + '<div class="row"><span>' + fmtDateLong(state.day) + "</span><span>" + state.slot + " hs</span></div>"
    + '<div class="row"><span>Seña online</span><span>' + fmtMoney(state.service.deposit_amount) + "</span></div>"
    + "</div>"
    + '<div class="card">'
    + '<label for="f-name">Tu nombre</label>'
    + '<input id="f-name" type="text" autocomplete="name" placeholder="Ej.: María González">'
    + '<label for="f-phone">Tu WhatsApp</label>'
    + '<input id="f-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Ej.: 5491123456789">'
    + '<p class="hint">Se abona una seña de ' + fmtMoney(state.service.deposit_amount)
    + " para reservar el turno. Te confirmamos por WhatsApp.</p>"
    + "</div>";
  validateForm();
}

function validateForm() {
  const name = document.getElementById("f-name");
  const phone = document.getElementById("f-phone");
  const ok = () => {
    const digits = phone.value.replace(/\D/g, "");
    cta.disabled = !(name.value.trim().length >= 2 && digits.length >= 8);
  };
  name.addEventListener("input", ok);
  phone.addEventListener("input", ok);
}

// ---------- acciones ----------
function selectService(i) {
  state.service = APP.services[i];
  state.day = null;
  state.step = "day";
  render();
}

function selectDay(iso) {
  state.day = iso;
  state.slot = null;
  state.step = "slot";
  render();
  loadSlots();
}

function selectSlot(t) {
  state.slot = t;
  state.step = "form";
  render();
}

async function loadSlots() {
  state.slots = null;
  renderSlot();
  try {
    const params = new URLSearchParams({
      tenant_id: APP.tenantId,
      service_id: state.service.id,
      day: state.day,
    });
    const res = await fetch("/public/available-slots?" + params);
    if (!res.ok) throw new Error("http " + res.status);
    const data = await res.json();
    state.slots = data.slots || [];
  } catch (e) {
    state.slots = "error";
  }
  renderSlot();
}

async function submitBooking() {
  const name = document.getElementById("f-name").value.trim();
  const phone = document.getElementById("f-phone").value.replace(/\D/g, "");
  if (name.length < 2 || phone.length < 8) return;

  // Clave idempotente: un mismo turno reintentado nunca genera dos reservas
  const key = "juturno:booking:" + APP.tenantId + ":" + state.service.id + ":" + state.day + ":" + state.slot;
  let idem = sessionStorage.getItem(key);
  if (!idem) { idem = uuid(); sessionStorage.setItem(key, idem); }

  setBusy(true, "Reservando…");
  try {
    const res = await fetch("/public/bookings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tenant_id: APP.tenantId,
        service_id: state.service.id,
        client_name: name,
        client_phone: phone,
        start_time: state.day + "T" + state.slot + ":00",
        idempotency_key: idem,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if ((res.status === 201 || res.status === 200) && data.payment_url) {
      setBusy(true, "Te llevamos al pago…");
      location.href = data.payment_url;
      return;
    }
    setBusy();
    if (res.status === 409) {
      showBanner("Ese horario se acaba de ocupar. Elegí otro, por favor.");
      state.slot = null;
      state.step = "slot";
      render();
      loadSlots();
    } else if (res.status === 502 || res.status === 504) {
      showBanner("El procesador de pagos no responde. Tocá de nuevo en unos segundos.");
    } else if (res.status === 400) {
      showBanner(data.detail || "Revisá tus datos e intentá de nuevo.");
    } else if (typeof data.detail === "string" && data.detail) {
      showBanner(data.detail);
    } else {
      showBanner("No pudimos crear la reserva (" + res.status + "). Intentá de nuevo.");
    }
  } catch (e) {
    setBusy();
    showBanner("Sin conexión. Revisá tu internet y probá otra vez.");
  }
}

function goBack() {
  if (state.step === "day") state.step = "service";
  else if (state.step === "slot") state.step = "day";
  else if (state.step === "form") state.step = "slot";
  render();
}

// ---------- pantallas post-pago (estáticas, sin consultar la API) ----------
function showResult(kind) {
  backBtn.hidden = true;
  ctaWrap.hidden = true;
  setProgress(null);
  const icons = {
    ok: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    bad: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/></svg>',
    wait: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#c084fc" stroke-width="3"/><path d="M12 7v5l3 3" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/></svg>',
  };
  let icon, title, text, btn;
  if (kind === "failure") {
    icon = "bad"; title = "El pago no se completó";
    text = "No se cobró nada. Podés volver a intentarlo cuando quieras.";
    btn = "Volver a reservar";
  } else if (kind === "pending") {
    icon = "wait"; title = "El pago está en proceso";
    text = "En cuanto se acredite la seña, el negocio te confirma por WhatsApp.";
    btn = "Entendido";
  } else {
    icon = "ok"; title = "Reserva registrada";
    text = "Recibimos tu pago. En breve te confirmamos por WhatsApp.";
    btn = "Hacer otra reserva";
  }
  subtitle.textContent = "Reserva #" + (new URLSearchParams(location.search).get("booking") || "");
  app.innerHTML = '<div class="card result">'
    + '<div class="icon ' + icon + '">' + icons[icon] + "</div>"
    + "<h2>" + title + "</h2><p>" + text + "</p>"
    + '<button type="button" class="cta" onclick="startOver()">' + btn + "</button></div>";
}

function startOver() { location.replace(location.pathname); }

// ---------- init ----------
backBtn.addEventListener("click", goBack);
cta.addEventListener("click", submitBooking);

const params = new URLSearchParams(location.search);
if (params.has("booking")) {
  const r = params.get("result");
  showResult(r === "failure" ? "failure" : r === "pending" ? "pending" : "success");
} else {
  render();
}
</script>
</body>
</html>
